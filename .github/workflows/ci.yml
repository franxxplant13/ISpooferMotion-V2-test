name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (example: v2.1.8)'
        required: true
        type: string

concurrency:
  group: ci-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  js-lua-checks:
    name: JS/TS/Lua Checks (Type & Lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run format:prettier:check
      - run: bun run format:stylua:check
      - run: bun run build:plugin
      - run: bun test tests
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build:app

      - name: Install Selene
        run: cargo install selene --version 0.31.0 --locked

      - name: Run Selene
        run: cd plugin && selene .

  rust-check:
    name: Rust Check & Lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: bun install --frozen-lockfile
      - run: bun run build:plugin
      - run: bun run rust:check
      - run: bun run rust:lint
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1

  windows-release:
    name: Build Windows installer (manual updates)
    needs: [js-lua-checks, rust-check]
    if: >-
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          os: windows

      - name: Choose release tag
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if (($env:REQUESTED_TAG -and $env:REQUESTED_TAG -ne $tag) -or ($env:PUSHED_TAG -and $env:PUSHED_TAG -ne $tag)) {
            throw "Release tag must match package.json version: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build app and bundled Studio plugin
        run: bun run tauri:build --bundles nsis

      - name: Test Windows install and clean uninstall
        shell: pwsh
        run: ./scripts/test-windows-uninstall.ps1

      - name: Create download checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($files.Count -eq 0) { throw 'No Windows installer was built.' }
          $files += Get-Item dist-plugin/ISpooferMotion.rbxmx
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Save installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IspooferMotion-pm-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-plugin/ISpooferMotion.rbxmx
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish manual-install release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: IspooferMotion pm ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          body: |
            Manual update build. Close the app and run the installer over your current V2 installation.
            Before uninstalling, use Settings > Backups > Export backup and keep the JSON file outside the app folder.
            Backups exclude cookies and API keys. See docs/FORK-UPDATES.md for details.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist-plugin/ISpooferMotion.rbxmx
            SHA256SUMS.txt
          fail_on_unmatched_files: true
